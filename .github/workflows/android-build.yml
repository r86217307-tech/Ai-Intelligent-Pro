name: Android Build Pipeline

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_target:
        description: "Target binary to build"
        required: true
        default: "debug_apk"
        type: choice
        options:
          - debug_apk
          - release_apk
          - release_aab
          - all

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # -------------------------------------------------------------
      # 1. CHECKOUT
      # -------------------------------------------------------------
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 2. NODE.JS
      # -------------------------------------------------------------
      - name: 2. Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # -------------------------------------------------------------
      # 3. VERIFY NODE / NPM
      # -------------------------------------------------------------
      - name: 3. Verify Node.js Environment
        run: |
          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

          echo "Node executable:"
          which node

          echo "NPM executable:"
          which npm

          node -e "console.log('Node major version:', process.versions.node.split('.')[0])"

      # -------------------------------------------------------------
      # 4. JAVA / JDK 21
      # -------------------------------------------------------------
      - name: 4. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      # -------------------------------------------------------------
      # 5. ANDROID SDK
      # -------------------------------------------------------------
      - name: 5. Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------------------
      # 6. INSTALL ANDROID SDK COMPONENTS
      # -------------------------------------------------------------
      - name: 6. Install Android SDK 36
        run: |
          echo "Installing Android SDK Platform 36..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses > /dev/null || true

      # -------------------------------------------------------------
      # 7. INSTALL NPM DEPENDENCIES
      # -------------------------------------------------------------
      - name: 7. Install Dependencies
        run: |
         npm install --legacy-peer-deps

      # -------------------------------------------------------------
      # 8. VERIFY CAPACITOR CLI
      # -------------------------------------------------------------
      - name: 8. Verify Capacitor CLI
        run: |
          echo "Node:"
          node -v

          echo "NPM:"
          npm -v

          echo "Capacitor CLI:"
          npx cap --version

      # -------------------------------------------------------------
      # 9. BUILD WEB APPLICATION
      # -------------------------------------------------------------
      - name: 9. Build Production Web Application
        run: |
          echo "Building web application..."
          npm run build

      # -------------------------------------------------------------
      # 10. VERIFY WEB BUILD
      # -------------------------------------------------------------
      - name: 10. Verify Web Build Artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::dist directory not found."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html not found."
            exit 1
          fi

          echo "Web build verified successfully."
          echo "Contents of dist:"
          ls -la dist

      # -------------------------------------------------------------
      # 11. CAPACITOR SYNC
      # -------------------------------------------------------------
      - name: 11. Capacitor Sync Android
        env:
          CAPACITOR_TELEMETRY: "false"
          CI: "true"
        run: |
          echo "Using Node:"
          node -v

          echo "Using Capacitor:"
          npx cap --version

          echo "Syncing web assets to Android..."
          npx cap sync android

      # -------------------------------------------------------------
      # 12. VERIFY ANDROID PROJECT
      # -------------------------------------------------------------
      - name: 12. Verify Android Project
        run: |
          if [ ! -d "android" ]; then
            echo "::error::Android directory not found."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "::error::Gradle wrapper not found."
            exit 1
          fi

          echo "Android project verified."

      # -------------------------------------------------------------
      # 13. SETUP GRADLE
      # -------------------------------------------------------------
      - name: 13. Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -------------------------------------------------------------
      # 14. PREPARE GRADLE WRAPPER
      # -------------------------------------------------------------
      - name: 14. Prepare Gradle Wrapper
        run: |
          cd android

          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Testing Gradle wrapper..."
          ./gradlew --version

      # -------------------------------------------------------------
      # 15. DECODE RELEASE KEYSTORE
      # -------------------------------------------------------------
      - name: 15. Decode Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release keystore secret found."

            mkdir -p android/app

            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

            if [ -s android/app/release.keystore ]; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "Keystore decoded successfully."
            else
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Keystore file is empty."
            fi
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured."
          fi

      # =============================================================
      # DEBUG APK
      # =============================================================

      - name: 16. Build Debug APK
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.build_target == 'debug_apk' || inputs.build_target == 'all' || inputs.build_target == '')) }}
        run: |
          echo "Building Debug APK..."

          cd android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # -------------------------------------------------------------
      # 17. UPLOAD DEBUG APK
      # -------------------------------------------------------------
      - name: 17. Upload Debug APK
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.build_target == 'debug_apk' || inputs.build_target == 'all' || inputs.build_target == '')) }}
        uses: actions/upload-artifact@v4
        with:
          name: sufia-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # =============================================================
      # RELEASE APK
      # =============================================================

      - name: 18. Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_apk' || inputs.build_target == 'all') }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building Release APK..."

          cd android

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      # -------------------------------------------------------------
      # 19. UPLOAD RELEASE APK
      # -------------------------------------------------------------
      - name: 19. Upload Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_apk' || inputs.build_target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: sufia-ai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      # =============================================================
      # RELEASE AAB
      # =============================================================

      - name: 20. Build Release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_aab' || inputs.build_target == 'all') }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Building Release AAB..."

          cd android

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

      # -------------------------------------------------------------
      # 21. UPLOAD RELEASE AAB
      # -------------------------------------------------------------
      - name: 21. Upload Release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_aab' || inputs.build_target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: sufia-ai-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      # -------------------------------------------------------------
      # 22. BUILD SUMMARY
      # -------------------------------------------------------------
      - name: 22. Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "Android Build Pipeline Finished"
          echo "======================================"

          echo "Node:"
          node -v

          echo "NPM:"
          npm -v

          echo "Java:"
          java -version

          echo "======================================"