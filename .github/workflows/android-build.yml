name: Android Build Pipeline

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_target:
        description: "Target binary to build"
        required: true
        default: "debug_apk"
        type: choice
        options:
          - debug_apk
          - release_apk
          - release_aab
          - all

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # =============================================================
      # 1. CHECKOUT
      # =============================================================

      - name: 1. Checkout Source Code
        uses: actions/checkout@v4


      # =============================================================
      # 2. NODE.JS 24
      # =============================================================

      - name: 2. Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"


      # =============================================================
      # 3. VERIFY NODE
      # =============================================================

      - name: 3. Verify Node.js Environment
        run: |
          echo "======================================"
          echo "Node.js Environment"
          echo "======================================"

          node --version
          npm --version

          echo "Node executable:"
          which node

          echo "NPM executable:"
          which npm

          echo "Node major version:"
          node -e "console.log(process.versions.node.split('.')[0])"


      # =============================================================
      # 4. JAVA JDK 21
      # =============================================================

      - name: 4. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"


      # =============================================================
      # 5. ANDROID SDK
      # =============================================================

      - name: 5. Setup Android SDK
        uses: android-actions/setup-android@v3


      # =============================================================
      # 6. INSTALL ANDROID SDK 36
      # =============================================================

      - name: 6. Install Android SDK 36
        run: |
          echo "======================================"
          echo "Installing Android SDK"
          echo "======================================"

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses > /dev/null || true

          echo "Android SDK ready."


      # =============================================================
      # 7. INSTALL NPM DEPENDENCIES
      # =============================================================

      - name: 7. Install Dependencies
        run: |
          echo "======================================"
          echo "Installing npm dependencies"
          echo "======================================"

          npm install --legacy-peer-deps

          echo "Dependencies installed."


      # =============================================================
      # 8. VERIFY CAPACITOR
      # =============================================================

      - name: 8. Verify Capacitor CLI
        run: |
          echo "======================================"
          echo "Capacitor Environment"
          echo "======================================"

          echo "Node:"
          node -v

          echo "NPM:"
          npm -v

          echo "Capacitor:"
          npx cap --version


      # =============================================================
      # 9. BUILD WEB APP
      # =============================================================

      - name: 9. Build Production Web Application
        run: |
          echo "======================================"
          echo "Building Web Application"
          echo "======================================"

          npm run build


      # =============================================================
      # 10. VERIFY DIST
      # =============================================================

      - name: 10. Verify Web Build
        run: |
          echo "Checking dist directory..."

          if [ ! -d "dist" ]; then
            echo "::error::dist directory not found."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html not found."
            exit 1
          fi

          echo "Web build verified successfully."

          ls -la dist


      # =============================================================
      # 11. CAPACITOR SYNC
      # =============================================================

      - name: 11. Capacitor Sync Android
        env:
          CAPACITOR_TELEMETRY: "false"
          CI: "true"
        run: |
          echo "======================================"
          echo "Capacitor Android Sync"
          echo "======================================"

          echo "Node:"
          node -v

          echo "Capacitor:"
          npx cap --version

          echo "Running Capacitor sync..."

          npx cap sync android

          echo "Capacitor sync completed."


      # =============================================================
      # 12. VERIFY ANDROID PROJECT
      # =============================================================

      - name: 12. Verify Android Project
        run: |
          echo "======================================"
          echo "Verifying Android Project"
          echo "======================================"

          if [ ! -d "android" ]; then
            echo "::error::android directory not found."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "::error::android/gradlew not found."
            exit 1
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Android project exists."


      # =============================================================
      # 13. REPAIR GRADLE WRAPPER
      # =============================================================

      - name: 13. Repair Gradle Wrapper
        run: |
          echo "======================================"
          echo "Repairing Gradle Wrapper"
          echo "======================================"

          GRADLE_VERSION="8.11.1"
          TEMP_DIR="$RUNNER_TEMP/gradle-repair"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          echo "Gradle version: $GRADLE_VERSION"

          cd "$TEMP_DIR"

          echo "Downloading Gradle $GRADLE_VERSION..."

          curl -L \
            --fail \
            --retry 3 \
            --connect-timeout 30 \
            -o gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          echo "Extracting Gradle..."

          unzip -q gradle.zip

          echo "Generating fresh Gradle Wrapper..."

          cd "gradle-${GRADLE_VERSION}"

          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"

          ./bin/gradle \
            -p "$GITHUB_WORKSPACE/android" \
            wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type all \
            --no-daemon

          echo "Fresh Gradle wrapper generated."

          cd "$GITHUB_WORKSPACE/android"

          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          echo "======================================"
          echo "Gradle Wrapper Properties"
          echo "======================================"

          cat gradle/wrapper/gradle-wrapper.properties

          echo "======================================"
          echo "Checking Wrapper JAR"
          echo "======================================"

          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::Gradle wrapper JAR is missing or empty."
            exit 1
          fi

          echo "Wrapper JAR exists."

          echo "======================================"
          echo "Testing Gradle Wrapper"
          echo "======================================"

          ./gradlew --version

          echo "Gradle wrapper is working."


      # =============================================================
      # 14. DECODE KEYSTORE
      # =============================================================

      - name: 14. Decode Release Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "======================================"
          echo "Release Keystore"
          echo "======================================"

          if [ -n "$KEYSTORE_BASE64" ]; then

            echo "Keystore secret found."

            mkdir -p android/app

            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

            if [ -s android/app/release.keystore ]; then
              echo "has_keystore=true" >> "$GITHUB_OUTPUT"
              echo "Keystore decoded successfully."
            else
              echo "has_keystore=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Keystore file is empty."
            fi

          else

            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured."

          fi


      # =============================================================
      # 15. BUILD DEBUG APK
      # =============================================================

      - name: 15. Build Debug APK
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.build_target == 'debug_apk' || inputs.build_target == 'all' || inputs.build_target == '')) }}
        run: |
          echo "======================================"
          echo "Building Debug APK"
          echo "======================================"

          cd android

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

          echo "Debug APK build completed."


      # =============================================================
      # 16. UPLOAD DEBUG APK
      # =============================================================

      - name: 16. Upload Debug APK
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.build_target == 'debug_apk' || inputs.build_target == 'all' || inputs.build_target == '')) }}
        uses: actions/upload-artifact@v4
        with:
          name: sufia-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


      # =============================================================
      # 17. BUILD RELEASE APK
      # =============================================================

      - name: 17. Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_apk' || inputs.build_target == 'all') }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "======================================"
          echo "Building Release APK"
          echo "======================================"

          cd android

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          echo "Release APK build completed."


      # =============================================================
      # 18. UPLOAD RELEASE APK
      # =============================================================

      - name: 18. Upload Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_apk' || inputs.build_target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: sufia-ai-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14


      # =============================================================
      # 19. BUILD RELEASE AAB
      # =============================================================

      - name: 19. Build Release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_aab' || inputs.build_target == 'all') }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "======================================"
          echo "Building Release AAB"
          echo "======================================"

          cd android

          ./gradlew bundleRelease \
            --no-daemon \
            --stacktrace

          echo "Release AAB build completed."


      # =============================================================
      # 20. UPLOAD RELEASE AAB
      # =============================================================

      - name: 20. Upload Release AAB
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release_aab' || inputs.build_target == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: sufia-ai-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30


      # =============================================================
      # 21. BUILD SUMMARY
      # =============================================================

      - name: 21. Build Summary
        if: always()
        run: |
          echo "======================================"
          echo "Android Build Pipeline Finished"
          echo "======================================"

          echo "Node:"
          node -v

          echo "NPM:"
          npm -v

          echo "Java:"
          java -version

          echo "======================================"